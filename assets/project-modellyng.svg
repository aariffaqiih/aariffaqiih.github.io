  <rect x="430" y="242" width="248" height="44" rx="8" fill="#FFFFFF" stroke="#E5E9F0"/>
  <text x="442" y="260" fill="#525860" font-family="Inter, system-ui, sans-serif" font-size="11">Compare methodology limitations</text>
  <text x="442" y="276" fill="#525860" font-family="Inter, system-ui, sans-serif" font-size="11">across uploaded papers...</text>

  <rect x="430" y="298" width="248" height="72" rx="8" fill="#FFFFFF" stroke="#BFE2EA"/>
  <text x="442" y="317" fill="#111315" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Agentic Synthesis (Verified)</text>
  <text x="442" y="335" fill="#525860" font-family="Inter, system-ui, sans-serif" font-size="10.5">Cited to exact PDF page blocks with</text>
  <text x="442" y="351" fill="#525860" font-family="Inter, system-ui, sans-serif" font-size="10.5">Accept / Edit / Reject human review.</text>

  <rect x="430" y="382" width="108" height="24" rx="12" fill="#DCFCE7"/>
  <text x="484" y="398" text-anchor="middle" fill="#15803D" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">Source Linked</text>
  <rect x="546" y="382" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#DCE2E9"/>
  <text x="612" y="398" text-anchor="middle" fill="#374151" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">FastAPI + Gemini</text>
</svg>
