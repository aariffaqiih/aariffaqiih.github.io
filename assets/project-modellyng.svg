  <text x="122" y="404" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="10.5">PostgreSQL · PLpgSQL · 11 Migrations</text>

  <!-- Right panel: Grounded Agent Chat & Verification -->
  <rect x="412" y="200" width="284" height="220" rx="12" fill="#F8FAFC" stroke="#EAEEF3"/>
