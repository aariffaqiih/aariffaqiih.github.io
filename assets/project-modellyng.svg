  <path d="M240 154 L256 154" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="262" y="140" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#DCE2E9"/>
  <text x="325" y="158" text-anchor="middle" fill="#111315" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Celery + Redis</text>
  <path d="M394 154 L410 154" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="416" y="140" width="126" height="28" rx="6" fill="#0F5C6E"/>
  <text x="479" y="158" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Hybrid RAG</text>
  <path d="M548 154 L564 154" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/>
