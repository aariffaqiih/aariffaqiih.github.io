<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#F2F4F7"/>
  <defs>
    <filter id="cardShadowM" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111315" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g filter="url(#cardShadowM)">
    <rect x="76" y="54" width="648" height="392" rx="16" fill="#FFFFFF" stroke="#E6E9EE" stroke-width="1.5"/>
