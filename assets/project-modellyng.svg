  <line x1="184" y1="278" x2="302" y2="264" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="184" y1="278" x2="220" y2="356" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="302" y1="264" x2="328" y2="348" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="220" y1="356" x2="328" y2="348" stroke="#0F5C6E" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Nodes -->
  <rect x="126" y="258" width="98" height="36" rx="8" fill="#0F5C6E"/>
  <text x="175" y="280" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">13 Parameters</text>

  <rect x="266" y="246" width="106" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="319" y="267" text-anchor="middle" fill="#111315" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Embeddings</text>

  <rect x="148" y="340" width="114" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="205" y="361" text-anchor="middle" fill="#111315" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Evidence Block</text>

