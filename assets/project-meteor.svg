  <text x="426" y="228" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">/plot · Data Viz Studio</text>
  <rect x="614" y="214" width="68" height="20" rx="10" fill="#0B2E26"/>
  <text x="648" y="228" text-anchor="middle" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">CSV/TSV</text>
  <text x="426" y="252" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Custom parsers &amp; renderers: Word Cloud,</text>
  <text x="426" y="270" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Bar, Time-Series Line &amp; Multi-Series Donut</text>
  <text x="426" y="292" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">NLP stopwords · Nullable series · Export</text>

  <!-- Card 3: /lab -->
  <rect x="104" y="318" width="288" height="102" rx="10" fill="#111827" stroke="#1F2937"/>
  <text x="122" y="342" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">/lab · 13 ML, Graph &amp; 3D Labs</text>
  <rect x="308" y="328" width="70" height="20" rx="10" fill="#2A1C3A"/>
  <text x="343" y="342" text-anchor="middle" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">WebGL 2</text>
  <text x="122" y="366" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">60 FPS ML Gradient Descent, Brandes Graph,</text>
  <text x="122" y="384" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Web-to-Markdown, Voxel &amp; Three.js + Jolt</text>
  <text x="122" y="406" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">Float64 Kepler 3D · BroadcastChannel 3D</text>

