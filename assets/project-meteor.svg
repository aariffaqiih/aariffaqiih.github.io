  <!-- Card 1: /math -->
  <rect x="104" y="204" width="288" height="100" rx="10" fill="#111827" stroke="#1F2937"/>
  <text x="122" y="228" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">/math · 40 STEM &amp; AI Solvers</text>
  <rect x="314" y="214" width="64" height="20" rx="10" fill="#0F293A"/>
  <text x="346" y="228" text-anchor="middle" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">KaTeX</text>
  <text x="122" y="252" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Linear &amp; Logistic Regression, NSGA-II,</text>
  <text x="122" y="270" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Simulated Annealing, Bayes &amp; 12 EVM KPIs</text>
  <text x="122" y="292" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">Static pre-rendered routes (Node build)</text>

