  <rect x="408" y="318" width="288" height="102" rx="10" fill="#111827" stroke="#1F2937"/>
  <text x="426" y="342" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Formal Proofs &amp; Test Suite</text>
  <rect x="614" y="328" width="68" height="20" rx="10" fill="#2E2410"/>
  <text x="648" y="342" text-anchor="middle" fill="#FBBF24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">Lean 4 ✓</text>
  <text x="426" y="366" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">6 Lean 4 proofs (Sort, Stack, Queue, Cipher)</text>
  <text x="426" y="384" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">80 Vitest test suites (683 test cases)</text>
  <text x="426" y="406" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">56.4k LOC · 381 commits · Zero framework</text>
