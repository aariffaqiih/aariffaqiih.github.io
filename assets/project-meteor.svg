  <path d="M254 167 L268 167" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="274" y="155" width="128" height="24" rx="6" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.6"/>
  <text x="338" y="171" text-anchor="middle" fill="#E0E7FF" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">Key/Model Health</text>
  <path d="M408 167 L422 167" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="428" y="155" width="122" height="24" rx="6" fill="#0F172A" stroke="#34D399" stroke-opacity="0.6"/>
  <text x="489" y="171" text-anchor="middle" fill="#D1FAE5" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">SSE + StripThink</text>
  <path d="M556 167 L570 167" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="576" y="155" width="104" height="24" rx="6" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.5"/>
  <text x="628" y="171" text-anchor="middle" fill="#FEF3C7" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600">KaTeX + GFM</text>

