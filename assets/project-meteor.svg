<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#F2F4F7"/>
  <defs>
    <filter id="cardShadowMet" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111315" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="meteorBg" x1="76" y1="54" x2="724" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="meteorGlow" x1="120" y1="120" x2="680" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g filter="url(#cardShadowMet)">
    <rect x="76" y="54" width="648" height="392" rx="16" fill="url(#meteorBg)" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- Window chrome -->
  <circle cx="106" cy="84" r="5" fill="#334155"/>
  <circle cx="124" cy="84" r="5" fill="#334155"/>
  <circle cx="142" cy="84" r="5" fill="#334155"/>
